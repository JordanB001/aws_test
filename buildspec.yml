version: 0.2

env:
  variables:
    DIST_DIR: dist

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - yarn install
  build:
    commands:
      - echo Building the frontend...
      - yarn run build
  post_build:
    commands:
      - echo Invalidating CloudFront cache...

artifacts:
  files:
    - '**/*'
  base-directory: $DIST_DIR