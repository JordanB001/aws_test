version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install
  build:
  commands:
    - echo "📦 package.json contents:"
    - cat package.json
    - echo "📁 Contents of node_modules/.bin:"
    - ls -la node_modules/.bin
    - echo "Building project..."
    - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: dist
