version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm install
  build:
    commands:
      - echo "Adding node_modules/.bin to PATH"
      - export PATH=$PWD/node_modules/.bin:$PATH
      - echo "Building project..."
      - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: dist
